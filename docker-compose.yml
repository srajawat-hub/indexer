# Postgres for local indexer testing (one chain).
# Usage: docker compose up -d  then run migrations and start the indexer on the host.

services:
  postgres:
    image: postgres:15-alpine
    container_name: indexer-postgres
    environment:
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer
      POSTGRES_DB: indexer
    ports:
      - "5432:5432"
    volumes:
      - indexer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer -d indexer"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  indexer_pgdata:
