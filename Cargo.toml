[package]
name = "indexer"
version = "0.1.0"
edition = "2021"

[features]
testnet = []

[dependencies]
alloy = { version = "0.9", features = ["full"] }
env_logger = "0.10"
log = "0.4"
hex = "0.4"
serde_json = "1.0"
futures-util = "0.3.31"
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4.39"
async-trait = "0.1.84"
tokio-postgres = { version = "0.7.12", features = ["with-serde_json-1"] }
actix-web = "4.9.0"
rust_decimal = "1.36.0"
serde = "1.0.217"
dotenv = "0.15.0"
toml = "0.8.19"
solana-client = "2.1.10"
solana-sdk = "2.1.10"
solana-transaction-status = "2.1.10"
base64 = "0.22.1"
bincode = "1.3.3"
borsh = "1.5.5"
reqwest = "0.12.12"
postgres-openssl = "0.5"
openssl = { version = "0.10", features = ["vendored"] }
