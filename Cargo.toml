[package]
name = "indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = { version = "0.9", features = ["full"] }
anchor-attribute-event = "0.31"
anchor-lang = { version = "0.31" }
env_logger = "0.10"
log = "0.4"
hex = "0.4"
serde_json = "1.0"
futures-util = "0.3.31"
tokio = { version = "1.0", features = ["full"] }
chrono = "0.4.39"
async-trait = "0.1.84"
tokio-postgres = { version = "0.7.12", features = ["with-serde_json-1"] }
actix-web = "4.9.0"
rust_decimal = "1.36.0"
serde = "1.0.217"
dotenv = "0.15.0"
toml = "0.8.19"
solana-client = "2.1.10"
solana-sdk = "2.1.10"
solana-transaction-status = "2.1.10"
spl-token = "6.0.0"
base64 = "0.22.1"
bincode = "1.3.3"
borsh = { version = "1.5.5", features = ["derive"], default-features = false }
borsh_0_10 = { version = "0.10.4", package = "borsh", default-features = false }
reqwest = "0.12.12"
postgres-openssl = "0.5"
openssl = { version = "0.10", features = ["vendored"] }
diesel = { version = "2.2.0", features = ["postgres"] }
anyhow = "1.0.95"
